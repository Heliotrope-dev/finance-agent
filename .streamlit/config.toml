# 2026-09-13：这一段从"最老的7个键"扩到 Streamlit 1.59 的完整主题面。
#
# 为什么值得改：在此之前，圆角、边框可见性、标题字阶、st.metric 的字号、
# 图表色板，全部是 app.py 里注入的 CSS 用 !important 一条条盖出来的。那套做法
# 有两个真实代价——
#
#   1. **盖不全。** CSS 只能命中我当时想到的选择器。Streamlit 用 React portal
#      渲染的那些东西（下拉菜单弹层、tooltip、日期选择器、dataframe 的网格线）
#      挂在 DOM 树的另一个位置，我的选择器够不着，所以它们一直是 Streamlit
#      的默认蓝+默认圆角，跟页面其余部分不是一套。
#   2. **闪一下。** 注入的 CSS 要等页面渲染到那一步才生效，首屏会先按默认主题
#      画一遍再被盖掉——st.metric 那个数字尤其明显，默认 2.25rem 先画出来，
#      然后跳到 24px。主题配置是在首次绘制之前就进去的，没有这一跳。
#
# 下面每个数值都跟 assets/theme.css 的 :root 里的 token 一一对应，
# 改一边必须改另一边——这两边是同一套设计系统的两个出口，不是两套配置。
[theme]
base = "light"
# 2026-09-04前端重做：主色从品牌红改成墨色。整个界面现在只有一条配色规矩
# ——页面上唯一允许出现的饱和色是涨跌红绿，其余一律走中性灰阶。主按钮跟着
# 用墨色而不是红色，涨跌数字才是页面上最跳的东西，这也是这类金融界面看着
# 专业的根本原因：品牌色一旦也很红，涨跌红就不再是最醒目的信息了。
primaryColor = "#17181C"
backgroundColor = "#FAFAFB"          # --bg-page
secondaryBackgroundColor = "#F3F4F6" # --bg-fill
textColor = "#17181C"                # --text-primary
# 链接同样走墨色而不是默认的蓝。这个项目里链接几乎都是"点进详情"这类导航，
# 不是外链引用，用一个饱和蓝会在满屏灰阶里变成最跳的东西，抢掉涨跌红绿。
linkColor = "#17181C"
# --line-divider。这一条影响的范围比看上去大：dataframe 的网格线、expander 的
# 分隔线、下拉弹层的描边全走它，而这些正是 CSS 补丁够不着的地方。
borderColor = "rgba(23,24,28,0.06)"
dataframeBorderColor = "rgba(23,24,28,0.06)"
codeBackgroundColor = "#F3F4F6"

# 输入控件不画外框。用户提过两次（"项目里面还是存在按键的外框这个我之前说过
# 很丑"）。在此之前是靠逐个选择器 border:none !important 盖的，每加一种新控件
# 就漏一个；这是官方开关，一次盖全。
# 无框之后靠背景色和留白分隔，这是这套界面本来的做法。
showWidgetBorder = false

# assets/theme.css 里的 --r-base。全站只留两个圆角：这个 2px，和胶囊用的
# 999px（主题配不了后者，也不需要——Streamlit 自己没有胶囊形控件）。
# 改造前有 2/4/7/8/10/50% 六种，其中 7px 是 rem 算出来的碎数，不是选出来的。
# 走"精密仪器"路线：锐利的 2px 贯彻到底。
baseRadius = "2px"
buttonRadius = "2px"

font = "Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif"

# st.metric 的数字，对应 theme.css 的 --fs-xl。那边已经有一条同值的 CSS
# （带 letter-spacing 和颜色，主题配不了那两项），这里再配一遍不是重复——
# 是为了首屏别先画一个 2.25rem 的大数字再跳到 24px。两处必须保持同值。
metricValueFontSize = "24px"
metricValueFontWeight = 600

# 标题字阶，对应 theme.css 的 --fs-xl / --fs-lg / 16px …。Streamlit 默认 h1 是
# 2.75rem，放在一个信息密度这么高的页面上过大了——这类界面的层级是靠字重和
# 留白拉开的，不是靠把标题放大一倍。
headingFontSizes = ["24px", "18px", "16px", "15px", "13px", "12px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]

# st.* 原生图表（Altair/Vega-Lite/未显式配色的 Plotly）的色板。
# charts.py 里那些图都显式指定了颜色，这组管的是没显式指定的那些——在此之前
# 它们会用 Streamlit 默认的蓝橙紫，跟"黑白灰为主、只有涨跌用红绿"这条规矩
# 直接冲突。改成一条灰阶，深浅表示次序。
chartCategoricalColors = [
    "#17181C", "#494C55", "#82858E", "#A8ABB3",
    "#C6C9CD", "#DBDCE3", "#EAEAEF", "#F3F4F6",
]
chartSequentialColors = [
    "#F7F7F9", "#EDEDF1", "#E0E1E6", "#D0D2D8", "#BDBFC7",
    "#A5A8B1", "#8A8D96", "#6D7079", "#4E5158", "#17181C",
]

[server]
headless = true
# enableCORS=false 曾经和 enableXsrfProtection=true 一起配置过，但Streamlit
# 认为这个组合不兼容，会强制把 enableCORS 改回 true——那行配置从来没真正
# 生效过，删掉避免误导。
enableXsrfProtection = true

[browser]
gatherUsageStats = false
# Streamlit自己校验WebSocket握手的Origin时，是拿"它以为自己被访问的地址"
# 去比对浏览器发来的Origin头；不配这两项时它只知道自己监听在127.0.0.1:8503，
# 跟浏览器实际发来的Origin（经nginx+Cloudflare转发后的公网地址+2053端口）
# 对不上，判定成"disallowed origin"直接拒绝握手——夜间日志审计在
# journalctl里实测到了~20次这个拒绝记录，跟"打开页面卡在骨架屏、要重试
# 十几次才连上WebSocket"这个体验问题吻合。显式告诉它对外的真实地址和
# 端口，跟浏览器Origin对上，握手就不会被拒。
serverAddress = "invest.heliotrope.online"
serverPort = 2053

[client]
# 不给访问者看Streamlit自带的开发者工具条。默认的 "auto" 会在部署刚更新完
# 之后弹出 "File change. Rerun / Always rerun" 这种提示——那是给开发者看的，
# 出现在一个对外的页面上只会让人困惑。"viewer" 保留正常的应用菜单，去掉
# 开发者项和这个改文件提示。
toolbarMode = "viewer"
