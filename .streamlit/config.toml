[theme]
base = "light"
# 之前这里是Streamlit默认的 #3b82f6（Tailwind蓝），跟App其余部分的品牌色
# 完全不搭——顶部红色横幅、涨跌红绿配色、加载遮罩的红色spinner都已经是
# 红色系，只有"登录""注册""添加""确认删除""生成对比图"这几个
# type="primary"按钮还是孤零零的默认蓝，视觉上像是没换完主题色的残留。
# 改成跟品牌色一致的红（跟UP_COLOR/顶部横幅同一个#e02020），全站主色调
# 统一成一套，不再撞色。
primaryColor = "#e02020"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
font = "sans serif"

[server]
headless = true
# enableCORS=false 曾经和 enableXsrfProtection=true 一起配置过，但Streamlit
# 认为这个组合不兼容，会强制把 enableCORS 改回 true——那行配置从来没真正
# 生效过，删掉避免误导。
enableXsrfProtection = true

[browser]
gatherUsageStats = false
# Streamlit自己校验WebSocket握手的Origin时，是拿"它以为自己被访问的地址"
# 去比对浏览器发来的Origin头；不配这两项时它只知道自己监听在127.0.0.1:8503，
# 跟浏览器实际发来的Origin（经nginx+Cloudflare转发后的公网地址+2053端口）
# 对不上，判定成"disallowed origin"直接拒绝握手——夜间日志审计在
# journalctl里实测到了~20次这个拒绝记录，跟"打开页面卡在骨架屏、要重试
# 十几次才连上WebSocket"这个体验问题吻合。显式告诉它对外的真实地址和
# 端口，跟浏览器Origin对上，握手就不会被拒。
serverAddress = "invest.heliotrope.online"
serverPort = 2053
